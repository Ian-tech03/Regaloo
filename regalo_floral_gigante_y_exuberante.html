<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor - Gran Ramo Exuberante</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #240a20 0%, #100314 100%);
            overflow-x: hidden;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        .title-font {
            font-family: 'Playfair Display', serif;
        }

        /* 3D Gift Box Container */
        .gift-container {
            perspective: 1400px;
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        .gift-container:hover {
            transform: scale(1.02);
        }

        .gift-box {
            position: relative;
            width: 320px;
            height: 260px;
            transform-style: preserve-3d;
            transition: transform 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gift-box.opened {
            transform: translateY(70px);
        }

        .box-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #701332 0%, #3d071a 100%);
            border-radius: 0 0 24px 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 3px 8px rgba(255,255,255,0.25);
            border: 2px solid #d4af37;
        }

        .box-ribbon-vertical {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 48px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #d4af37, #fff8dc, #d4af37);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .box-lid {
            position: absolute;
            top: 25px;
            left: -18px;
            width: 356px;
            height: 65px;
            background: linear-gradient(135deg, #851b40 0%, #4a0d22 100%);
            border-radius: 14px;
            border: 2px solid #d4af37;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            transform-origin: top;
            transition: transform 1.2s cubic-bezier(0.3, 1.5, 0.6, 1), top 1.2s ease;
            z-index: 30;
        }

        .gift-box.opened .box-lid {
            transform: rotateX(-120deg) translateY(-50px);
            top: -15px;
        }

        .lid-ribbon {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 48px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #d4af37, #fff8dc, #d4af37);
        }

        .bow {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 45px;
            z-index: 40;
            transition: transform 1s cubic-bezier(0.3, 1.5, 0.6, 1), opacity 0.5s ease;
        }

        .gift-box.opened .bow {
            transform: translateX(-50%) translateY(-90px) rotate(-18deg) scale(1.25);
        }

        /* Continuous Petals Rain and Float Animation */
        @keyframes floatPetal {
            0% { transform: translateY(-20px) translateX(0) rotate(0deg) scale(0.7); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(var(--drift)) rotate(720deg) scale(1.2); opacity: 0; }
        }

        .falling-petal {
            position: fixed;
            background: radial-gradient(circle, #ffb6c1 0%, #ff69b4 60%, #db2777 100%);
            border-radius: 150% 0 150% 0;
            animation: floatPetal linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        /* Sparkles animation */
        @keyframes sparkle {
            0%, 100% { transform: scale(0.4) rotate(0deg); opacity: 0.2; }
            50% { transform: scale(1.4) rotate(180deg); opacity: 1; text-shadow: 0 0 20px #ffd700; }
        }

        .sparkle-star {
            animation: sparkle 2.5s infinite ease-in-out;
            pointer-events: none;
        }

        /* Exuberant Gigantic Bouquet Container */
        .bouquet-container {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            z-index: 20;
            transition: transform 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.3) 0.3s;
            pointer-events: none;
            width: 520px;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-box.opened .bouquet-container {
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 relative text-white">

    <!-- Encabezado con el texto romántico solicitado -->
    <header class="w-full text-center pt-6 pb-2 z-20">
        <div class="inline-block px-8 py-3.5 bg-white/5 backdrop-blur-xl border border-pink-400/30 rounded-full shadow-[0_0_35px_rgba(244,114,182,0.3)]">
            <h1 class="title-font text-2xl sm:text-4xl lg:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-200 via-rose-300 to-amber-200 tracking-wide drop-shadow-[0_2px_15px_rgba(244,114,182,0.6)]">
                ¡Te amo mucho, eres super increíble! &lt;3
            </h1>
        </div>
        <p class="text-xs sm:text-sm text-pink-200/70 mt-3 font-light tracking-widest uppercase animate-pulse">Toca la caja para abrir tu gran ramo de flores</p>
    </header>

    <!-- Contenedor Central del Regalo -->
    <main class="flex-1 flex flex-col items-center justify-center relative w-full my-auto">
        
        <div id="giftWrapper" class="gift-container mt-12" onclick="openGift()">
            <div id="giftBox" class="gift-box">
                <!-- Moño superior -->
                <div class="bow">
                    <svg viewBox="0 0 100 50" class="w-full h-full drop-shadow-xl">
                        <path d="M50 25 C 28 3, 2 12, 18 28 C 34 44, 44 28, 50 25 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
                        <path d="M50 25 C 72 3, 98 12, 82 28 C 66 44, 56 28, 50 25 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
                        <circle cx="50" cy="25" r="9" fill="#ffdf73" stroke="#b8860b" stroke-width="2"/>
                    </svg>
                </div>
                <!-- Tapa -->
                <div class="box-lid">
                    <div class="lid-ribbon"></div>
                </div>
                <!-- Cuerpo -->
                <div class="box-body">
                    <div class="box-ribbon-vertical"></div>
                    <div class="absolute top-5 left-1/2 transform -translate-x-1/2 bg-white/95 text-rose-950 px-4 py-1.5 rounded-full text-xs font-bold shadow-md border border-rose-300 tracking-wide">
                        ✨ ¡Sorpresa para ti! ✨
                    </div>
                </div>

                <!-- RAMO GIGANTE Y EXUBERANTE (Muchísimos lirios, orquídeas, flor de loto y follaje) -->

                        <defs>

                            <radialGradient id="lotusCenterGrad" cx="50%" cy="50%" r="50%">

                            <radialGradient id="lotusSoftGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#ffe4e6"/>

                                <stop offset="100%" stop-color="#e11d48"/>
                            </radialGradient>
                            <linearGradient id="lilyWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="60%" stop-color="#fff0f5"/>
                                <stop offset="100%" stop-color="#f472b6"/>
                            </linearGradient>
                            <linearGradient id="lilyPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffe4e6"/>
                                <stop offset="50%" stop-color="#f472b6"/>
                                <stop offset="100%" stop-color="#be185d"/>
                            </linearGradient>

                        <!-- Tallos y ramas múltiples y densas -->

                            <path d="M225 350 Q 225 250 225 180"/>

                            <circle cx="0" cy="-8" r="10" fill="#facc15"/>

                        <!-- Loto Secundario Derecha -->

                            <path d="M0 0 Q -45 -55 0 -85 Q 45 -55 0 0" fill="url(#lotusSoftGrad)" opacity="0.9"/>
                            <path d="M0 0 Q -35 25 -65 -12 Q -35 -35 0 0" fill="url(#lotusSoftGrad)"/>
                            <path d="M0 0 Q 35 25 65 -12 Q 35 -35 0 0" fill="url(#lotusSoftGrad)"/>
                            <circle cx="0" cy="-8" r="9" fill="#facc15"/>
                        </g>


                        <!-- GRUPO EXUBERANTE DE LIRIOS (Blancos, rosados y amarillos) -->
                        <!-- Lirio 1 (Izquierda Extrema) -->
                        <g transform="translate(100, 150) rotate(-35)">
                            <ellipse cx="0" cy="-35" rx="13" ry="32" fill="url(#lilyWhiteGrad)" stroke="#f472b6" stroke-width="0.6"/>
                            <ellipse cx="-20" cy="-14" rx="11" ry="26" fill="url(#lilyWhiteGrad)" stroke="#f472b6" stroke-width="0.6" transform="rotate(-30)"/>
                            <ellipse cx="20" cy="-14" rx="11" ry="26" fill="url(#lilyWhiteGrad)" stroke="#f472b6" stroke-width="0.6" transform="rotate(30)"/>
                            <ellipse cx="0" cy="14" rx="10" ry="22" fill="url(#lilyWhiteGrad)" stroke="#f472b6" stroke-width="0.6"/>
                            <path d="M0 0 Q -7 -20 -14 -35 M0 0 Q 0 -22 7 -37 M0 0 Q 7 -20 20 -30" stroke="#d97706" stroke-width="1.8" fill="none"/>
                            <circle cx="-14" cy="-35" r="3.5" fill="#92400e"/>
                            <circle cx="7" cy="-37" r="3.5" fill="#92400e"/>
                            <circle cx="20" cy="-30" r="3.5" fill="#92400e"/>
                        </g>

                        <!-- Lirio 2 (Derecha Extrema) -->
                        <g transform="translate(350, 150) rotate(35)">
                            <ellipse cx="0" cy="-35" rx="13" ry="32" fill="url(#lilyWhiteGrad)" stroke="#f472b6" stroke-width="0.6"/>
                            <ellipse cx="-20" cy="-14" rx="11" ry="26" fill="url(#lilyWhiteGrad)" stroke="#f472b6" stroke-width="0.6" transform="rotate(-30)"/>
                            <ellipse cx="20" cy="-14" rx="11" ry="26" fill="url(#lilyWhiteGrad)" stroke="#f472b6" stroke-width="0.6" transform="rotate(30)"/>
                            <ellipse cx="0" cy="14" rx="10" ry="22" fill="url(#lilyWhiteGrad)" stroke="#f472b6" stroke-width="0.6"/>
                            <path d="M0 0 Q -7 -20 -14 -35 M0 0 Q 0 -22 7 -37 M0 0 Q 7 -20 20 -30" stroke="#d97706" stroke-width="1.8" fill="none"/>
                            <circle cx="-14" cy="-35" r="3.5" fill="#92400e"/>
                            <circle cx="7" cy="-37" r="3.5" fill="#92400e"/>
                            <circle cx="20" cy="-30" r="3.5" fill="#92400e"/>
                        </g>

                        <!-- Lirio 3 (Superior Izquierda - Rosado) -->

                            <ellipse cx="0" cy="-32" rx="12" ry="29" fill="url(#lilyPinkGrad)" stroke="#db2777" stroke-width="0.6"/>
                            <ellipse cx="-18" cy="-12" rx="10" ry="24" fill="url(#lilyPinkGrad)" stroke="#db2777" stroke-width="0.6" transform="rotate(-30)"/>
                            <ellipse cx="18" cy="-12" rx="10" ry="24" fill="url(#lilyPinkGrad)" stroke="#db2777" stroke-width="0.6" transform="rotate(30)"/>
                            <path d="M0 0 Q 0 -20 5 -32" stroke="#78350f" stroke-width="1.5" fill="none"/>
                            <circle cx="5" cy="-32" r="3" fill="#451a03"/>
                        </g>

                        <!-- Lirio 4 (Superior Derecha - Rosado) -->
                        <g transform="translate(300, 90) rotate(15)">
                            <ellipse cx="0" cy="-32" rx="12" ry="29" fill="url(#lilyPinkGrad)" stroke="#db2777" stroke-width="0.6"/>
                            <ellipse cx="-18" cy="-12" rx="10" ry="24" fill="url(#lilyPinkGrad)" stroke="#db2777" stroke-width="0.6" transform="rotate(-30)"/>
                            <ellipse cx="18" cy="-12" rx="10" ry="24" fill="url(#lilyPinkGrad)" stroke="#db2777" stroke-width="0.6" transform="rotate(30)"/>
                            <path d="M0 0 Q 0 -20 -5 -32" stroke="#78350f" stroke-width="1.5" fill="none"/>
                            <circle cx="-5" cy="-32" r="3" fill="#451a03"/>
                        </g>

                        <!-- Lirio 5 (Centro Superior - Amarillo Luminoso) -->

                            <ellipse cx="0" cy="-30" rx="11" ry="28" fill="url(#lilyYellowGrad)" stroke="#d97706" stroke-width="0.6"/>
                            <ellipse cx="-16" cy="-10" rx="9" ry="23" fill="url(#lilyYellowGrad)" stroke="#d97706" stroke-width="0.6" transform="rotate(-30)"/>
                            <ellipse cx="16" cy="-10" rx="9" ry="23" fill="url(#lilyYellowGrad)" stroke="#d97706" stroke-width="0.6" transform="rotate(30)"/>
                            <path d="M0 0 Q 0 -18 0 -30" stroke="#78350f" stroke-width="1.5" fill="none"/>
                            <circle cx="0" cy="-30" r="3" fill="#451a03"/>

                        <!-- GRUPO EXUBERANTE DE ORQUÍDEAS (Púrpuras y Fucsias vibrantes) -->

                        <g transform="translate(170, 160) rotate(-25)">
                            <path d="M0 0 Q -32 -38 -42 -20 Q -48 0 -25 7 Z" fill="url(#orchidPurpleGrad)" opacity="0.95"/>
                            <path d="M0 0 Q 32 -38 42 -20 Q 48 0 25 7 Z" fill="url(#orchidPurpleGrad)" opacity="0.95"/>

                        <!-- Orquídea 2 (Medio Derecha) -->
                        <g transform="translate(280, 160) rotate(25)">
                            <path d="M0 0 Q -32 -38 -42 -20 Q -48 0 -25 7 Z" fill="url(#orchidPurpleGrad)" opacity="0.95"/>
                            <path d="M0 0 Q 32 -38 42 -20 Q 48 0 25 7 Z" fill="url(#orchidPurpleGrad)" opacity="0.95"/>
                            <path d="M0 0 Q 0 -55 14 -42 Q 25 -18 0 0 Z" fill="url(#orchidPurpleGrad)"/>
                            <path d="M0 0 Q -20 32 0 42 Q 20 32 0 0 Z" fill="#fae8ff" stroke="#a855f7" stroke-width="1.2"/>

                            <path d="M0 0 Q 0 -55 14 -42 Q 25 -18 0 0 Z" fill="url(#orchidMagentaGrad)"/>
                            <path d="M0 0 Q -20 32 0 42 Q 20 32 0 0 Z" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.2"/>

        <!-- Botón de apertura -->

                <span>Abrir Regalo Mágico</span>
                <span class="text-2xl">🎁</span>
            </button>
        </div>

        <!-- Contenedor para efectos de destellos y lluvia continua de pétalos -->
        <div id="effectsContainer" class="fixed inset-0 pointer-events-none overflow-hidden z-10"></div>
    </main>

    <!-- Scripts Interactivos -->
    <script>
        let isOpened = false;

        function openGift() {
            const giftBox = document.getElementById('giftBox');
            const actionBtn = document.getElementById('actionBtn');

            if (!isOpened) {
                giftBox.classList.add('opened');
                isOpened = true;
                actionBtn.innerText = "Cerrar Regalo 💌";

                // Iniciar lluvia continua de pétalos y destellos mágicos
                startContinuousRain();
            } else {
                giftBox.classList.remove('opened');
                isOpened = false;
                actionBtn.innerText = "Abrir Regalo Mágico 🎁";
                stopContinuousRain();
            }
        }

        let rainInterval = null;

        function startContinuousRain() {
            const container = document.getElementById('effectsContainer');
            container.innerHTML = '';

            // Crear ráfaga inicial de destellos
            for (let i = 0; i < 25; i++) {
                const star = document.createElement('div');
                star.classList.add('absolute', 'sparkle-star', 'text-amber-300');
                star.innerHTML = '✨';
                star.style.left = `${Math.random() * 90 + 5}%`;
                star.style.top = `${Math.random() * 70 + 15}%`;
                star.style.fontSize = `${Math.random() * 20 + 12}px`;
                star.style.animationDelay = `${Math.random() * 2}s`;
                container.appendChild(star);
            }

            // Generar pétalos continuamente
            rainInterval = setInterval(() => {
                createFallingPetal(container);
            }, 150);
        }

        function createFallingPetal(container) {
            const petal = document.createElement('div');
            petal.classList.add('falling-petal');

            const size = Math.random() * 14 + 8;
            petal.style.width = `${size}px`;
            petal.style.height = `${size * 1.6}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.top = `-30px`;

            const duration = Math.random() * 3 + 3.5;
            petal.style.animationDuration = `${duration}s`;

            const drift = `${(Math.random() - 0.5) * 250}px`;
            petal.style.setProperty('--drift', drift);

            container.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }

        function stopContinuousRain() {
            if (rainInterval) {
                clearInterval(rainInterval);
                rainInterval = null;
            }
            const container = document.getElementById('effectsContainer');
            container.innerHTML = '';
        }
